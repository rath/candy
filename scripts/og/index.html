<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Candy social card artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242b35; }
    #card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #faf6ed; }
    .coral { position: absolute; left: 596px; top: -90px; width: 700px; height: 820px; background: #f2a28e; transform: rotate(-7deg); border-radius: 40px; }
    .brand { position: absolute; left: 54px; top: 46px; display: flex; align-items: center; gap: 14px; font-size: 39px; font-weight: 780; letter-spacing: -1.5px; }
    .brand img { width: 44px; height: 44px; }
    h1 { position: absolute; left: 54px; top: 157px; margin: 0; width: 540px; font-size: 76px; font-weight: 780; line-height: 1.04; letter-spacing: -3px; }
    h1 span { color: #923e2c; }
    .description { position: absolute; left: 58px; top: 426px; margin: 0; width: 455px; font-size: 23px; line-height: 1.5; font-weight: 450; color: #555c65; }
    .editor { position: absolute; left: 611px; top: 124px; width: 552px; height: auto; border-radius: 12px; box-shadow: 0 24px 42px #57231338; }
    .domain { position: absolute; left: 58px; bottom: 43px; font-size: 20px; font-weight: 650; letter-spacing: -.25px; }
    .platform { position: absolute; right: 40px; bottom: 44px; margin: 0; color: #693627; font-size: 17px; font-weight: 550; }
    .ko { display: none; }
    :lang(ko) .en { display: none; }
    :lang(ko) .ko { display: block; }
    :lang(ko) h1 { top: 163px; font-size: 67px; line-height: 1.23; letter-spacing: -2.5px; }
    :lang(ko) .description { top: 425px; font-size: 23px; line-height: 1.55; }
  </style>
  <script>
    document.documentElement.lang = new URLSearchParams(location.search).get('lang') === 'ko' ? 'ko' : 'en';
  </script>
</head>
<body>
  <main id="card" aria-label="Candy social sharing image">
    <div class="coral" aria-hidden="true"></div>
    <div class="brand"><img src="../../site/assets/favicon.svg" alt="" />Candy</div>
    <h1 class="en">Small edits.<br /><span>Back to<br />your day.</span></h1>
    <h1 class="ko">이미지 편집,<br /><span>간단하게.</span></h1>
    <p class="description en">Your Mac’s little image editor.<br />Free. Open source. Entirely local.</p>
    <p class="description ko">강조할 때는 형광펜, 가릴 때는 모자이크.<br />Mac용 무료 오픈소스 이미지 편집기.</p>
    <img class="editor" src="../../site/assets/candy-editor.png" width="1800" height="1400" alt="The real Candy editor with a highlighted travel card and a pixelated sample email" />
    <div class="domain">candy.told.me</div>
    <p class="platform en">macOS 14+ · Apple Silicon</p>
    <p class="platform ko">macOS 14 이상 · Apple Silicon</p>
  </main>
</body>
</html>
