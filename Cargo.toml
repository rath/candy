[workspace]
members = ["crates/candy-core", "crates/candy-macos", "crates/candy-ffi", "crates/candy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
